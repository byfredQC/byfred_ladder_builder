name: Release

on:
  push:
    tags: ['v*']        # git tag v1.2.0 && git push origin v1.2.0  ->  GitHub Release with the add-on zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the add-on (folder byfred_ladder_builder, ready for Blender "Install from Disk")
        run: zip -r byfred_ladder_builder.zip byfred_ladder_builder -x '*/__pycache__/*' '*.pyc'
      - uses: actions/upload-artifact@v4
        with:
          name: byfred_ladder_builder
          path: byfred_ladder_builder.zip
      - name: Publish the Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: byfred_ladder_builder.zip
          generate_release_notes: true

      - name: Announce on Discord
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}   # repo Settings > Secrets and variables > Actions
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "No DISCORD_WEBHOOK secret - skipped"; exit 0; fi
          NOTES=$(gh release view "$TAG" --repo "$REPO" --json body -q .body 2>/dev/null | head -c 1500)
          URL="https://github.com/$REPO/releases/tag/$TAG"
          ZIP="https://github.com/$REPO/releases/download/$TAG/byfred_ladder_builder.zip"
          jq -n --arg tag "$TAG" --arg url "$URL" --arg zip "$ZIP" --arg notes "$NOTES" '{
            username: "Byfred Ladder Builder",
            embeds: [{
              title: ("Byfred Ladder Builder " + $tag + " est sorti !"),
              url: $url,
              color: 5793266,
              description: ((if $notes == "" then "" else $notes + "\n\n" end) + "⬇️ **[Télécharger le zip](" + $zip + ")** - Blender › Preferences › Add-ons › Install from Disk")
            }]
          }' > payload.json
          curl -sS -f -H "Content-Type: application/json" -d @payload.json "$DISCORD_WEBHOOK"
